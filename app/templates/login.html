<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>VentaIA — Iniciar Sesión</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#b5000b", "on-primary": "#ffffff",
            "primary-container": "#e30613", "on-primary-container": "#fff5f3",
            "secondary-container": "#fed400", "on-secondary-container": "#6f5c00",
            "error-container": "#ffdad6", "error": "#ba1a1a",
            "surface-container-highest": "#e4e2e1", "surface-container-low": "#f6f3f2",
            "surface-container-lowest": "#ffffff", "surface-variant": "#e4e2e1",
            "on-surface": "#1b1c1c", "on-surface-variant": "#5e3f3b",
            "background": "#fbf9f8", "outline": "#936e69",
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          spacing: { "lg": "24px", "md": "16px", "xl": "40px", "xs": "4px", "sm": "8px" },
          fontFamily: { "display": ["Montserrat"], "body-md": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"] },
          fontSize: {
            "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
            "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}"/>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Login Card -->
  <div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant overflow-hidden flex flex-col relative z-10 transition-transform duration-300 hover:-translate-y-1 hover:shadow-[0px_8px_24px_rgba(0,0,0,0.1)]">

    <!-- Header / Logo -->
    <div class="px-8 pt-8 pb-4 text-center border-b border-surface-container-highest">
      <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center mx-auto mb-3">
        <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1;">storefront</span>
      </div>
      <h1 class="font-display text-3xl font-extrabold text-primary mb-1">VentaIA</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">Portal de Administración</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="px-6 pt-4 flex flex-col gap-2">
      {% for category, message in messages %}
      <div class="px-4 py-3 rounded-lg text-sm font-medium {% if category == 'error' %}bg-error-container text-error{% else %}bg-secondary-container text-on-secondary-container{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- Form -->
    <div class="px-8 py-6 flex flex-col gap-5">
      <form class="flex flex-col gap-4" method="POST">

        <!-- Username -->
        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-on-surface-variant ml-1" for="username">Usuario</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size:20px;">person</span>
            <input autocomplete="off" class="w-full bg-surface-container-low border border-surface-variant rounded-lg pl-10 pr-3 py-2.5 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="username" name="username" placeholder="admin" required type="text"/>
          </div>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1">
          <label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Contraseña</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size:20px;">lock</span>
            <input class="w-full bg-surface-container-low border border-surface-variant rounded-lg pl-10 pr-10 py-2.5 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required type="password"/>
            <button aria-label="Mostrar contraseña" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none p-0.5" type="button">
              <span class="material-symbols-outlined" id="toggleIcon" style="font-size:20px;">visibility_off</span>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button class="w-full mt-1 bg-primary text-on-primary text-sm font-semibold rounded-lg h-11 flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-95 transition-all shadow-[0px_4px_12px_rgba(181,0,11,0.2)] hover:shadow-[0px_8px_24px_rgba(181,0,11,0.3)]" type="submit">
          Iniciar Sesión
          <span class="material-symbols-outlined" style="font-size:20px;">arrow_forward</span>
        </button>
      </form>

      <p class="text-center text-xs text-on-surface-variant">Sistema interno de gestión de ventas</p>
    </div>
  </div>

  <!-- Dark mode toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button onclick="toggleTheme()"
      class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container-lowest border border-surface-variant text-on-surface-variant hover:bg-surface-container-low transition-colors shadow-sm"
      aria-label="Cambiar tema">
      <span class="material-symbols-outlined text-xl" data-theme-icon="">dark_mode</span>
    </button>
  </div>

  <!-- Background decorative -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-5">
    <div class="w-[600px] h-[600px] bg-primary rounded-full blur-[100px]"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.querySelector('button[aria-label="Mostrar contraseña"]');
      const inp = document.getElementById('password');
      const ico = document.getElementById('toggleIcon');
      if (btn && inp && ico) {
        btn.addEventListener('click', () => {
          inp.type = inp.type === 'password' ? 'text' : 'password';
          ico.textContent = inp.type === 'password' ? 'visibility_off' : 'visibility';
        });
      }
    });
  </script>
</body>
</html>
